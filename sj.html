        <script>
      // Kill sticky classroom-2/3 workers before Scramjet boots.
      (async function () {
        const FLAG = 'abulxt:sw-c6-retired';
        try {
          if (!('serviceWorker' in navigator)) return;
          const regs = await navigator.serviceWorker.getRegistrations();
          let killed = false;
          for (const reg of regs) {
            const worker = reg.active || reg.waiting || reg.installing;
            const script = worker ? new URL(worker.scriptURL).pathname : '';
            if (script.endsWith('/sw-app-c6.js')) continue;
            await reg.unregister();
            killed = true;
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          if (killed && !sessionStorage.getItem(FLAG)) {
            sessionStorage.setItem(FLAG, '1');
            location.reload();
            return;
          }
          sessionStorage.removeItem(FLAG);
        } catch (e) {}
      })();
