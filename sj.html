      (async function () {
        const FLAG = 'abulxt:sw-c6-retired';
        try {
          if (!('serviceWorker' in navigator)) return;
          const regs = await navigator.serviceWorker.getRegistrations();

            const worker = reg.active || reg.waiting || reg.installing;
